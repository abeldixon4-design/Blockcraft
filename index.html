<style>
  :root{
    --panel2:#221d19;
    --edge:#4d453c;
    --edge-hi:#8d8172;
    --text:#efe7d8;
    --dim:#a49a8b;
    --gold:#f2c14e;
    --green:#3f7f42;
    --green-hi:#7ec482;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none;background:#0d0b0a;color:var(--text);
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    -webkit-user-select:none;user-select:none;touch-action:none}
  canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
  .hide{display:none !important}

  .screen{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:12px;padding:22px 18px;overflow-y:auto;background:rgba(10,8,7,.76)}
  .screen.dirt{background:rgba(10,8,7,.76)}
  #sTitle{background:linear-gradient(rgba(6,9,16,.44),rgba(6,9,16,.05) 38%,rgba(6,9,16,.60))}
  .screen > *{position:relative;z-index:1}
  h1{font-size:clamp(26px,9vw,44px);letter-spacing:.24em;font-weight:400;color:var(--gold);
    text-shadow:0 4px 0 #000,0 0 30px rgba(242,193,78,.3);text-align:center;line-height:1.25}
  h1 small{display:block;font-size:11px;letter-spacing:.42em;color:var(--dim);text-shadow:none;margin-top:10px}
  h2{font-size:15px;letter-spacing:.16em;font-weight:400;color:var(--gold);text-align:center;
    text-shadow:0 2px 0 rgba(0,0,0,.7)}
  .stack{display:flex;flex-direction:column;gap:8px;width:min(400px,92vw)}
  .row{display:flex;gap:8px;width:min(400px,92vw)}
  .row > *{flex:1}
  .mc{display:flex;align-items:center;justify-content:center;min-height:42px;padding:9px 14px;
    background:linear-gradient(#8f8f8f 0%,#767676 52%,#5b5b5b 100%);
    border:2px solid #0e0e0e;
    box-shadow:inset 0 2px 0 rgba(255,255,255,.26), inset 0 -3px 0 rgba(0,0,0,.34);
    color:#f2f2f2;text-shadow:2px 2px 0 rgba(0,0,0,.6);
    text-align:center;font-size:13px;letter-spacing:.05em}
  .mc:hover{background:linear-gradient(#a9c5e2 0%,#8aa9cd 52%,#6d8bb0 100%);border-color:#fff;color:#fff}
  .mc:active{background:linear-gradient(#6d8bb0,#5c7799)}
  .mc[disabled]{opacity:.45;pointer-events:none;filter:grayscale(1)}
  .mc.go{background:linear-gradient(#68b46d 0%,#3f7f42 52%,#2e6432 100%)}
  .mc.go:hover{background:linear-gradient(#93d698 0%,#57a35c 52%,#3f7f42 100%);border-color:#fff}
  .mc.warn{background:linear-gradient(#b4655c 0%,#8a453d 52%,#6c3630 100%);color:#f7ded9}
  .mc.warn:hover{background:linear-gradient(#d0847a 0%,#a5564c 52%,#8a453d 100%);border-color:#fff}

  .logowrap{position:relative;width:min(520px,94vw)}
  #logo{width:100%;height:auto;image-rendering:pixelated;display:block;
    filter:drop-shadow(0 7px 14px rgba(0,0,0,.5))}
  #splash{position:absolute;right:-1%;bottom:-4%;color:#ffe24a;white-space:nowrap;
    font-size:clamp(10px,3.1vw,16px);text-shadow:2px 2px 0 #4a3d0a;pointer-events:none;
    transform-origin:center;animation:splashPulse .95s ease-in-out infinite}
  @keyframes splashPulse{0%,100%{transform:rotate(-17deg) scale(1)}50%{transform:rotate(-17deg) scale(1.08)}}
  #ver{position:absolute;left:9px;bottom:7px;z-index:2;font-size:10px;color:#ededed;
    text-shadow:1px 1px 0 #000}
  .note{font-size:11px;color:var(--dim);line-height:1.9;text-align:center;max-width:344px}
  kbd{border:1px solid var(--edge);padding:1px 5px;background:#221d19;font:inherit;font-size:11px}

  #worldList{display:flex;flex-direction:column;gap:7px;width:min(360px,92vw);max-height:44vh;overflow-y:auto}
  .world{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--panel2);
    border:3px solid var(--edge);text-align:left;width:100%}
  .world.sel{border-color:var(--gold);background:#2c2620}
  .world canvas{width:34px;height:34px;image-rendering:pixelated;border:2px solid #000;flex:0 0 auto}
  .world .meta{flex:1;min-width:0}
  .world b{display:block;font-weight:400;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .world span{font-size:10px;color:var(--dim)}
  .empty{padding:26px 12px;text-align:center;font-size:12px;color:var(--dim);border:3px dashed var(--edge)}

  input[type=text]{width:100%;padding:11px 12px;background:#0e0c0b;border:3px solid var(--edge);
    color:var(--text);font:inherit;font-size:13px;outline:none}
  input[type=text]:focus{border-color:var(--gold)}
  label.field{display:block;font-size:11px;color:var(--dim);margin-bottom:5px;letter-spacing:.1em}

  .opt{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;
    background:var(--panel2);border:3px solid var(--edge);font-size:12px}
  .opt b{font-weight:400}
  .opt .val{color:var(--gold);font-size:11px;min-width:60px;text-align:right}
  input[type=range]{-webkit-appearance:none;appearance:none;width:110px;height:8px;background:#0e0c0b;
    border:2px solid var(--edge);outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:18px;background:var(--gold);border:2px solid #000}
  input[type=range]::-moz-range-thumb{width:14px;height:18px;background:var(--gold);border:2px solid #000;border-radius:0}
  .toggle{width:60px;padding:6px 0;text-align:center;border:2px solid var(--edge);background:#0e0c0b;font-size:11px}
  .toggle.on{background:var(--green);border-color:var(--green-hi)}

  #hud{position:fixed;inset:0;z-index:5;pointer-events:none}
  #crosshair{position:absolute;left:50%;top:50%;width:20px;height:20px;margin:-10px 0 0 -10px;opacity:.9}
  #crosshair:before,#crosshair:after{content:"";position:absolute;background:#fff;mix-blend-mode:difference}
  #crosshair:before{left:9px;top:0;width:2px;height:20px}
  #crosshair:after{top:9px;left:0;height:2px;width:20px}
  #coords{position:absolute;top:calc(env(safe-area-inset-top) + 8px);left:8px;font-size:10px;line-height:1.6;
    background:rgba(16,13,11,.66);padding:5px 8px;border:2px solid var(--edge);white-space:pre}
  #toast{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 132px);
    font-size:12px;text-shadow:0 2px 0 #000;opacity:0;transition:opacity .3s;white-space:nowrap}
  #bars{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 76px);
    display:flex;flex-direction:column;gap:3px;align-items:center}
  .gauge{display:flex;gap:1px;min-height:11px}
  .gauge i{width:11px;height:11px;background-size:contain;background-repeat:no-repeat;image-rendering:pixelated}
  #hotbar{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 12px);
    display:flex;gap:3px;padding:3px;background:rgba(16,13,11,.7);border:3px solid var(--edge);pointer-events:auto}
  .slot{position:relative;width:min(44px,9.4vw);height:min(44px,9.4vw);border:2px solid #37312b;
    background:rgba(42,38,34,.9);display:flex;align-items:center;justify-content:center}
  .slot canvas{width:72%;height:72%;image-rendering:pixelated}
  .slot .n{position:absolute;right:2px;bottom:0;font-size:11px;text-shadow:1px 1px 0 #000}
  .slot .k{position:absolute;left:3px;top:0;font-size:9px;color:var(--dim)}
  .slot.on{border-color:var(--gold);background:rgba(70,62,48,.95)}

  #water{position:fixed;inset:0;z-index:4;background:rgba(32,102,172,.26);pointer-events:none;opacity:0;transition:opacity .18s}
  #hurt{position:fixed;inset:0;z-index:4;pointer-events:none;opacity:0;
    background:radial-gradient(ellipse at center,rgba(140,0,0,0) 40%,rgba(150,10,10,.72) 100%);transition:opacity .3s}

  .touchonly{display:none}
  body.touch .touchonly{display:flex}
  .tbtn{position:absolute;pointer-events:auto;background:rgba(16,13,11,.66);border:3px solid var(--edge);
    align-items:center;justify-content:center;font-size:11px;letter-spacing:.05em}
  .tbtn:active{border-color:var(--gold);background:rgba(60,52,40,.85)}
  #pad{position:absolute;left:14px;bottom:calc(env(safe-area-inset-bottom) + 84px);width:130px;height:130px;
    border-radius:50%;border:3px solid var(--edge);background:rgba(16,13,11,.34);pointer-events:auto}
  #nub{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;
    background:rgba(239,231,216,.32);border:3px solid var(--edge-hi)}
  #bMine{right:110px;bottom:calc(env(safe-area-inset-bottom) + 156px);width:74px;height:58px}
  #bUse {right:20px; bottom:calc(env(safe-area-inset-bottom) + 156px);width:74px;height:58px}
  #bJump{right:20px; bottom:calc(env(safe-area-inset-bottom) + 88px);width:74px;height:58px}
  #bRun {right:110px;bottom:calc(env(safe-area-inset-bottom) + 88px);width:74px;height:58px}
  #bRun.on{border-color:var(--gold);color:var(--gold)}
  #bBag {top:calc(env(safe-area-inset-top) + 8px);right:78px;width:62px;height:32px}
  #bPause{top:calc(env(safe-area-inset-top) + 8px);right:8px;width:62px;height:32px;display:flex;pointer-events:auto}

  .win{width:min(440px,95vw);max-height:92vh;background:#17130f;border:3px solid var(--edge);
    box-shadow:0 16px 44px rgba(0,0,0,.65);padding:12px;display:flex;flex-direction:column;gap:10px}
  .wintop{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .wintop b{font-weight:400;font-size:12px;letter-spacing:.14em;color:var(--gold)}
  .tabs{display:flex;gap:4px}
  .tab{padding:6px 13px;border:2px solid var(--edge);background:#0e0c0b;font-size:11px}
  .tab.on{border-color:var(--gold);color:var(--gold);background:#2a231a}
  .pane{display:flex;flex-direction:column;gap:8px;overflow-y:auto;min-height:0}
  .grid{display:grid;grid-template-columns:repeat(9,1fr);gap:3px;width:100%}

      for(let i=0;i<pts.length;i++){
        let dx=Math.abs(pts[i].x-x-0.5), dy=Math.abs(pts[i].y-y-0.5);
        dx=Math.min(dx,TS-dx); dy=Math.min(dy,TS-dy);
        const d = dx*dx+dy*dy;
        if(d<d1){ d2=d1; d1=d; ci=pts[i].c; } else if(d<d2) d2=d;
      }
      if(Math.sqrt(d2)-Math.sqrt(d1) < edge) setPx(t,x,y,line);
      else { let i=ci; if(rnd()<0.3) i=(i+1)%pal.length; setPx(t,x,y,pal[i]); }

  /* 11 water — redrawn each frame-ish so the surface moves */
  drawWater = function(phase){

      const w = Math.sin(x*0.62 + y*0.28 + phase)*0.5 + Math.sin(x*0.23 - y*0.51 - phase*0.8)*0.5;
      const k = (w+1)/2;
      setPx(11,x,y,[Math.round(48+k*28), Math.round(114+k*32), Math.round(216+k*28)], 0.70);

  (function(){

      let fx = 6.5+cr()*3, fy = 6.5+cr()*3;
      const ang = (i/P + cr()*0.10)*Math.PI*2;
      const dx = Math.cos(ang), dy = Math.sin(ang), path = [];

        fx += dx + (cr()-0.5)*0.8;

function buildLogo(word){
  const S = 9, c = document.getElementById("logo"), g = c.getContext("2d");
  const cols = word.length*6 - 1;
  c.width = cols*S + S; c.height = 7*S + S;
  g.imageSmoothingEnabled = false;
  const cells = [], has = {};
  for(let i=0;i<word.length;i++){
    const pat = FONT5[word.charAt(i)];
    for(let y=0;y<7;y++) for(let x=0;x<5;x++) if(pat[y].charAt(x) === "1"){
      cells.push([i*6+x, y]); has[(i*6+x)+","+y] = 1;
    }
  }
  g.fillStyle = "rgba(0,0,0,.52)";
  cells.forEach(p => g.fillRect(p[0]*S + 4, p[1]*S + 4, S, S));
  cells.forEach(p => {
    const px = p[0]*S, py = p[1]*S;
    const ox = (p[0]*5 + p[1]*3) % 9, oy = (p[0]*7 + p[1]*5) % 9;
    g.drawImage(atlas, 3*TS+ox, oy, 7, 7, px, py, S, S);      // tile 3 is the stone face
    g.fillStyle = "rgba(255,255,255,.13)"; g.fillRect(px,py,S,S);
    g.fillStyle = "rgba(255,255,255,.26)"; g.fillRect(px,py,S,1); g.fillRect(px,py,1,S);
    g.fillStyle = "rgba(0,0,0,.34)"; g.fillRect(px,py+S-1,S,1); g.fillRect(px+S-1,py,1,S);
    g.fillStyle = "#0c0c0c";
    if(!has[p[0]+","+(p[1]-1)]) g.fillRect(px,py,S,1);
    if(!has[p[0]+","+(p[1]+1)]) g.fillRect(px,py+S-1,S,1);
    if(!has[(p[0]-1)+","+p[1]]) g.fillRect(px,py,1,S);
    if(!has[(p[0]+1)+","+p[1]]) g.fillRect(px+S-1,py,1,S);
  });
  document.getElementById("splash").textContent = SPLASH[(Math.random()*SPLASH.length)|0];
}

  g.drawImage(atlas,(t%GRID)*TS,((t/GRID)|0)*TS,TS,TS,0,0,c.width,c.height);

}
function pixIcon(pattern, colors){
  const h = pattern.length, w = pattern[0].length;
  const c = document.createElement("canvas"); c.width=w+2; c.height=h+2;
  const g = c.getContext("2d");
  const on = (x,y) => x>=0&&y>=0&&x<w&&y<h&&pattern[y][x]!==".";
  for(let y=0;y<h;y++) for(let x=0;x<w;x++) if(on(x,y)){
    g.fillStyle="#000"; g.fillRect(x,y+1,3,1); g.fillRect(x+1,y,1,3);
  }
  for(let y=0;y<h;y++) for(let x=0;x<w;x++) if(on(x,y)){
    g.fillStyle = colors[pattern[y][x]] || colors.X; g.fillRect(x+1,y+1,1,1);
  }
  return c.toDataURL();
}

/* ═══════════ world ═══════════ */
let chunks = new Map();
let edits  = new Map();
const key = (cx,cz) => cx+","+cz;
const IDX = (x,y,z) => (y<<8) | ((z&15)<<4) | (x&15);

function getBlock(x,y,z){
  if(y<0 || y>=WH) return 0;
  const c = chunks.get(key(x>>4, z>>4));
  return c ? c.blocks[IDX(x,y,z)] : 0;
}
function markDirty(cx,cz){ const c = chunks.get(key(cx,cz)); if(c) c.dirty = true; }
function setBlock(x,y,z,b,record){
  if(y<0 || y>=WH) return;
  const cx=x>>4, cz=z>>4, k=key(cx,cz), c=chunks.get(k);
  if(!c || c.blocks[IDX(x,y,z)] === b) return;
  c.blocks[IDX(x,y,z)] = b;
  c.dirty = true;
  if(record !== false){
    let m = edits.get(k); if(!m){ m = new Map(); edits.set(k,m); }
    m.set(IDX(x,y,z), b);
  }
  const lx=x&15, lz=z&15;
  if(lx===0)  markDirty(cx-1,cz);
  if(lx===15) markDirty(cx+1,cz);
  if(lz===0)  markDirty(cx,cz-1);
  if(lz===15) markDirty(cx,cz+1);
}
function columnHeight(wx,wz){
  let h = 30 + fbm(wx*0.0125, wz*0.0125, 4) * 20;
  h += fbm(wx*0.055 + 40, wz*0.055 - 20, 2) * 3;
  const m = noise2(wx*0.0042 + 120, wz*0.0042 - 90);
  if(m > 0.22) h += (m - 0.22) * 78;
  return Math.max(1, Math.min(WH-9, Math.round(h)));
}
const caveAt = (x,y,z) => noise3(x*0.055, y*0.09, z*0.055) > 0.42;

function generate(cx,cz){
  const blocks = new Uint8Array(CS*CS*WH);
  const put = (x,y,z,b) => { if(x>=0&&x<16&&z>=0&&z<16&&y>=0&&y<WH) blocks[(y<<8)|(z<<4)|x]=b; };
  for(let z=0;z<CS;z++) for(let x=0;x<CS;x++){
    const wx=cx*CS+x, wz=cz*CS+z, h=columnHeight(wx,wz), beach = h <= SEA+1;
    for(let y=0;y<=h;y++){
      let b;
      if(y===0) b=11;
      else if(y===h) b = beach?4:1;
      else if(y>h-4) b = beach?4:2;
      else b=3;
      if(b===3 && y>2 && y<h-2 && caveAt(wx,y,wz)) continue;
      put(x,y,z,b);
    }
    for(let y=h+1;y<=SEA;y++) put(x,y,z,9);
    if(h > 2 && h < SEA-1){
      // meadows, not an even sprinkle: a low-frequency field decides where they grow
      const meadow = noise2(wx*0.085 + 300, wz*0.085 - 210);
      if(meadow > 0.08 && hash3(wx, h+1, wz) < 0.55) put(x, h+1, z, 21);
    }
  }
  for(let z=-3;z<CS+3;z++) for(let x=-3;x<CS+3;x++){
    const wx=cx*CS+x, wz=cz*CS+z;
    if(hash2(wx,wz) > 0.018) continue;
    const h = columnHeight(wx,wz);
    if(h <= SEA+2 || caveAt(wx,h,wz)) continue;
    const top = h + 4 + ((hash2(wx+7,wz-3)*3)|0);
    for(let ly=-3;ly<=1;ly++) for(let lz=-2;lz<=2;lz++) for(let lx=-2;lx<=2;lx++){
      const d = Math.abs(lx)+Math.abs(lz)+Math.abs(ly+1);
      if(d>4 || (ly>=0 && (Math.abs(lx)===2||Math.abs(lz)===2))) continue;
      if(lx===0&&lz===0&&ly<0) continue;
      const thin = hash3(wx+lx, top+ly, wz+lz);       // deterministic, so chunk seams still line up
      if(d>=3 && thin < 0.45) continue;
      if(d===2 && thin < 0.15) continue;
      put(x+lx, top+ly, z+lz, 6);
    }
    for(let y=h+1;y<=top;y++) put(x,y,z,5);
    put(x,h,z,2);
  }
  const m = edits.get(key(cx,cz));
  if(m) m.forEach((b,i) => { blocks[i] = b; });
  return {cx,cz,blocks,mesh:null,cutMesh:null,glowMesh:null,clearMesh:null,dirty:true};
}

const occ = b => (opaqueB(b) && solid(b)) ? 1 : 0;
function build(ch){
  const G0={p:[],u:[],c:[],i:[]}, G1={p:[],u:[],c:[],i:[]},
        G2={p:[],u:[],c:[],i:[]}, G3={p:[],u:[],c:[],i:[]};
  const bx0=ch.cx*CS, bz0=ch.cz*CS, useAO=OPT.smooth;
  for(let y=0;y<WH;y++) for(let z=0;z<CS;z++) for(let x=0;x<CS;x++){
    const b = ch.blocks[(y<<8)|(z<<4)|x];
    if(b===0) continue;
    const D=BLOCKS[b], see=!!(D.clear||D.cut), wx=bx0+x, wz=bz0+z;
    const g = D.clear ? G2 : (D.cut ? G1 : (D.glow ? G3 : G0));
    if(D.cross){
      // two quads in an X, the way grass and seagrass are drawn
      const tile=D.t[0], tx=tile%GRID, ty=(tile/GRID)|0;
      const jx = (hash3(wx,y,wz)-0.5)*0.24, jz = (hash3(wz,y,wx)-0.5)*0.24;
      const u0=(tx+0.002)/GRID, u1=(tx+0.998)/GRID;
      const v0=1-(ty+0.998)/GRID, v1=1-(ty+0.002)/GRID;
      const arm=[[0.12,0.12,0.88,0.88],[0.88,0.12,0.12,0.88]];
      for(let s=0;s<2;s++){
        const a=arm[s], base=g.p.length/3;
        g.p.push(wx+a[0]+jx, y,      wz+a[1]+jz,
                 wx+a[2]+jx, y,      wz+a[3]+jz,
                 wx+a[2]+jx, y+0.94, wz+a[3]+jz,
                 wx+a[0]+jx, y+0.94, wz+a[1]+jz);
        g.u.push(u0,v0, u1,v0, u1,v1, u0,v1);
        for(let k=0;k<4;k++) g.c.push(0.95,0.95,0.95);
        g.i.push(base,base+1,base+2, base,base+2,base+3);
      }
      continue;
    }
    // a water block with open air above sits lower, like a real surface
    const top = (b===9 && !isWater(getBlock(wx,y+1,wz))) ? 0.875 : 1;
    for(let f=0;f<6;f++){
      const F=FACES[f], n=F.n;
      const nb = getBlock(wx+n[0], y+n[1], wz+n[2]);
      if(!seeThru(nb)) continue;
      if(nb === b && !D.cut) continue;   // leaves keep their inner faces; water and glass do not
      if(b === 9 && isWater(nb)) continue;   // no pane between water and a waterlogged plant
      const tile=D.t[f], tx=tile%GRID, ty=(tile/GRID)|0, base=g.p.length/3;
      const u=F.u, v=F.v, A=[3,3,3,3];
      let shade = F.s;
      if(D.cut){
        // count the canopy stacked in front of this face: buried leaves go dark
        let deep = 0;
        for(let s=1;s<=4;s++){
          const q = getBlock(wx+n[0]*s, y+n[1]*s, wz+n[2]*s);
          if(q !== 0 && !clearB(q)) deep++;
        }
        shade *= 1 - 0.13*deep;
      }
      if(!see && useAO){
        for(let k=0;k<4;k++){
          const su=CORN[k][0], sv=CORN[k][1];
          const px=wx+n[0], py=y+n[1], pz=wz+n[2];
          const s1=occ(getBlock(px+su*u[0],py+su*u[1],pz+su*u[2]));
          const s2=occ(getBlock(px+sv*v[0],py+sv*v[1],pz+sv*v[2]));
          const cr=occ(getBlock(px+su*u[0]+sv*v[0],py+su*u[1]+sv*v[1],pz+su*u[2]+sv*v[2]));
          A[k] = (s1&&s2)?0:3-(s1+s2+cr);
        }
      }
      for(let k=0;k<4;k++){
        const su=CORN[k][0], sv=CORN[k][1];
        let vy = y+0.5+n[1]*0.5+(su*u[1]+sv*v[1])*0.5;
        if(top!==1 && vy > y+0.99) vy = y+top;
        g.p.push(wx+0.5+n[0]*0.5+(su*u[0]+sv*v[0])*0.5, vy,
                 wz+0.5+n[2]*0.5+(su*u[2]+sv*v[2])*0.5);
        const fu = su>0 ? 0.9985 : 0.0015, fv = sv>0 ? 0.0015 : 0.9985;
        g.u.push((tx+fu)/GRID, 1-(ty+fv)/GRID);
        const l = shade*AOMUL[A[k]];
        g.c.push(l,l,l);
      }
      if(A[0]+A[2] > A[1]+A[3]) g.i.push(base,base+1,base+2, base,base+2,base+3);
      else                      g.i.push(base+1,base+2,base+3, base+1,base+3,base);
    }
  }
  swap(ch,"mesh",     G0, matOpaque, 0);
  swap(ch,"glowMesh", G3, matGlow,   0);
  swap(ch,"cutMesh",  G1, matCut,    0);
  swap(ch,"clearMesh",G2, matClear,  1);
  ch.dirty = false;
}
function swap(ch,slot,g,mat,order){
  if(ch[slot]){ scene.remove(ch[slot]); ch[slot].geometry.dispose(); ch[slot]=null; }
  if(!g.i.length) return;
  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.Float32BufferAttribute(g.p,3));
  geo.setAttribute("uv",       new THREE.Float32BufferAttribute(g.u,2));
  geo.setAttribute("color",    new THREE.Float32BufferAttribute(g.c,3));
  geo.setIndex(g.i); geo.computeBoundingSphere();
  const m = new THREE.Mesh(geo, mat); m.renderOrder = order;
  ch[slot] = m; scene.add(m);
}
function dropChunk(ch){
  ["mesh","cutMesh","glowMesh","clearMesh"].forEach(s => {
    if(ch[s]){ scene.remove(ch[s]); ch[s].geometry.dispose(); }
  });
  chunks.delete(key(ch.cx,ch.cz));
}
function wipeWorld(){
  chunks.forEach(dropChunk);
  chunks = new Map(); edits = new Map();
}

/* water creeps back into any opening below sea level */
const SIDES = [[1,0],[-1,0],[0,1],[0,-1]];
function floodWater(x0,y0,z0){
  if(y0 > SEA) return;
  const q = [[x0,y0,z0]];
  let head = 0, n = 0;
  while(head < q.length && n < 900){
    const c = q[head++]; n++;
    const x=c[0], y=c[1], z=c[2];
    if(y < 1 || y > SEA) continue;
    if(getBlock(x,y,z) !== 0) continue;
    let fed = isWater(getBlock(x,y+1,z));
    if(!fed) for(let i=0;i<4 && !fed;i++) fed = isWater(getBlock(x+SIDES[i][0], y, z+SIDES[i][1]));
    if(!fed) continue;
    setBlock(x,y,z,9);
    q.push([x,y-1,z]);
    for(let i=0;i<4;i++) q.push([x+SIDES[i][0], y, z+SIDES[i][1]]);
  }
}

let RD = OPT.rd, ring = [];
function setRD(v){
  RD = v; ring = [];
  for(let z=-RD-1;z<=RD+1;z++) for(let x=-RD-1;x<=RD+1;x++) ring.push({x,z,d:Math.hypot(x,z)});
  ring.sort((a,b)=>a.d-b.d);
  scene.fog.near = RD*CS*0.55; scene.fog.far = RD*CS*0.98;
}
setRD(OPT.rd);

function stream(px,pz){
  const pcx=Math.floor(px/CS), pcz=Math.floor(pz/CS), t0=performance.now();
  let made=0, meshed=0;
  for(let i=0;i<ring.length;i++){
    const r = ring[i]; if(r.d > RD+1.5) break;
    const cx=pcx+r.x, cz=pcz+r.z;
    if(!chunks.has(key(cx,cz))){
      chunks.set(key(cx,cz), generate(cx,cz));
      markDirty(cx-1,cz); markDirty(cx+1,cz); markDirty(cx,cz-1); markDirty(cx,cz+1);
      if(++made>=2 || performance.now()-t0>9) break;
    }
  }
  for(let i=0;i<ring.length;i++){
    const r = ring[i]; if(r.d > RD) break;
    const cx=pcx+r.x, cz=pcz+r.z, ch=chunks.get(key(cx,cz));
    if(!ch || !ch.dirty) continue;
    if(!chunks.has(key(cx-1,cz))||!chunks.has(key(cx+1,cz))||
       !chunks.has(key(cx,cz-1))||!chunks.has(key(cx,cz+1))) continue;
    build(ch);
    if(++meshed>=2 || performance.now()-t0>14) break;
  }
  if(!made && !meshed) chunks.forEach(ch => {
    if(Math.max(Math.abs(ch.cx-pcx),Math.abs(ch.cz-pcz)) > RD+2) dropChunk(ch);
  });
}
function areaReady(px,pz){
  const pcx=Math.floor(px/CS), pcz=Math.floor(pz/CS);
  for(let z=-1;z<=1;z++) for(let x=-1;x<=1;x++){
    const c = chunks.get(key(pcx+x,pcz+z));
    if(!c || c.dirty) return false;
  }
  return true;
}

/* ═══════════ player ═══════════ */
const HALF=0.3, TALL=1.8, EYE=1.62, G=26, JUMP=8.6, WALK=4.4, RUN=6.4;
const P = {
  pos:new THREE.Vector3(), vel:new THREE.Vector3(), yaw:0.6, pitch:-0.15,
  ground:false, hp:20, food:20, air:300, fallFrom:null,
  regen:0, hurtCool:0, starve:0, drown:0, slot:0,
  canStep:false, jumpPrev:false, wetFor:0, stepped:false
};
let world = null, inv = new Array(27).fill(null), held = null;
const prevPos = new THREE.Vector3(), viewPos = new THREE.Vector3();
const STEP = 1/120;
let physAcc = 0;
function settle(){ prevPos.copy(P.pos); viewPos.copy(P.pos); physAcc = 0; }

function hits(p){
  const x0=Math.floor(p.x-HALF), x1=Math.floor(p.x+HALF);
  const y0=Math.floor(p.y),      y1=Math.floor(p.y+TALL-0.001);
  const z0=Math.floor(p.z-HALF), z1=Math.floor(p.z+HALF);
  for(let y=y0;y<=y1;y++) for(let z=z0;z<=z1;z++) for(let x=x0;x<=x1;x++)
    if(solid(getBlock(x,y,z))) return true;
  return false;
}
const EPS = 1e-4;
const STEP_MAX = 2.4;   // how far above you a ledge can be and still be climbable
const CLIMB = 0.045;    // how much of that you haul yourself up per physics step
// pressing into a bank while you are in the water pulls you up and over it
function stepUp(){
  if(P.stepped) return false;
  const y0 = P.pos.y;
  let need = -1;
  for(let lift=0.08; lift<=STEP_MAX+1e-6; lift+=0.08){
    P.pos.y = y0 + lift;
    if(!hits(P.pos)){ need = lift; break; }
  }
  if(need < 0){ P.pos.y = y0; return false; }   // nothing within reach: it is a wall, not a ledge
  P.stepped = true;
  if(P.vel.y < 0) P.vel.y = 0;
  if(need <= CLIMB){ P.pos.y = y0 + need; return true; }
  P.pos.y = y0 + CLIMB;   // still against the face; rise a little and try again next step
  return false;
}
function axisMove(axis,d){
  if(!d) return;
  P.pos[axis] += d;
  if(!hits(P.pos)) return;
  if(axis !== "y" && P.canStep && stepUp()) return;
  // land exactly on the face we hit, so a resting position is bit-for-bit stable
  if(axis === "y"){
    if(d < 0){ P.pos.y = Math.floor(P.pos.y) + 1; P.ground = true; }
    else       P.pos.y = Math.floor(P.pos.y + TALL) - TALL - EPS;
    P.vel.y = 0;
  } else {
    const h = P.pos[axis];
    P.pos[axis] = d > 0 ? Math.floor(h + HALF) - HALF - EPS
                        : Math.floor(h - HALF) + 1 + HALF + EPS;
    P.vel[axis] = 0;
  }
  // only if something is still overlapping (spawned inside terrain, say) do we creep out
  let guard = 0;
  while(hits(P.pos) && guard++ < 140) P.pos[axis] += (d > 0 ? -0.02 : 0.02);
}
const inLiquid   = () => isWater(getBlock(Math.floor(P.pos.x), Math.floor(P.pos.y+0.6), Math.floor(P.pos.z)));
const eyeInWater = () => isWater(getBlock(Math.floor(P.pos.x), Math.floor(P.pos.y+EYE), Math.floor(P.pos.z)));

function findSpawn(){
  for(let r=0;r<40;r++) for(let a=0;a<8;a++){
    const x = Math.round(Math.cos(a)*r*4), z = Math.round(Math.sin(a)*r*4);
    const h = columnHeight(x,z);
    if(h > SEA+1 && !caveAt(x,h,z)) return {x:x+0.5, y:h+1.2, z:z+0.5};
  }
  return {x:0.5, y:SEA+4, z:0.5};
}

/* ═══════════ inventory ═══════════ */
function addItem(id,n){
  if(!id || !n) return true;
  for(let i=0;i<27 && n>0;i++){
    const s = inv[i];
    if(s && s[0]===id && s[1]<64){ const take=Math.min(64-s[1],n); s[1]+=take; n-=take; }
  }
  for(let i=0;i<27 && n>0;i++) if(!inv[i]){ const take=Math.min(64,n); inv[i]=[id,take]; n-=take; }
  if(n>0){ toast("Inventory full"); return false; }
  return true;
}
const countOf = id => inv.reduce((a,s)=> a + (s && s[0]===id ? s[1] : 0), 0);
function takeItem(id,n){
  for(let i=0;i<27 && n>0;i++){
    const s = inv[i];
    if(s && s[0]===id){ const take=Math.min(s[1],n); s[1]-=take; n-=take; if(!s[1]) inv[i]=null; }
  }
}

function gauge(el, val, full, half, none){

const gSig = {hp:-1, food:-1, air:-1};
function drawBars(){

    const st = inv[i], sig = st ? st[0]+"x"+st[1] : "-";
    if(el._sig !== sig){ el._sig = sig; fillSlot(el, st); }
    el.classList.toggle("on", i===P.slot);
  });
  const hp=Math.floor(P.hp), fd=Math.floor(P.food), ar=(P.air>=300?-1:Math.ceil(P.air/30));
  if(hp !== gSig.hp){ gSig.hp = hp; gauge(gHp, P.hp, ICON.hpFull, ICON.hpHalf, ICON.hpNone); }
  if(fd !== gSig.food){ gSig.food = fd; gauge(gFood, P.food, ICON.fdFull, ICON.fdHalf, ICON.fdNone); }
  if(ar !== gSig.air){
    gSig.air = ar; gAir.innerHTML = "";
    for(let i=0;i<(ar<0?0:ar);i++){
      const s=document.createElement("i"); s.style.backgroundImage="url("+ICON.air+")"; gAir.appendChild(s);
    }

/* ═══════════ mining / using ═══════════ */
let mining=false, mineProg=0, mineKey=null;
function target(){
  const dir = new THREE.Vector3(0,0,-1).applyEuler(new THREE.Euler(P.pitch,P.yaw,0,"YXZ"));
  const o = new THREE.Vector3(P.pos.x,P.pos.y+EYE,P.pos.z);
  let x=Math.floor(o.x), y=Math.floor(o.y), z=Math.floor(o.z);
  const sx=Math.sign(dir.x), sy=Math.sign(dir.y), sz=Math.sign(dir.z);
  const dx=sx?Math.abs(1/dir.x):Infinity, dy=sy?Math.abs(1/dir.y):Infinity, dz=sz?Math.abs(1/dir.z):Infinity;
  let tx=sx?((sx>0?x+1-o.x:o.x-x)*dx):Infinity;
  let ty=sy?((sy>0?y+1-o.y:o.y-y)*dy):Infinity;
  let tz=sz?((sz>0?z+1-o.z:o.z-z)*dz):Infinity;
  let nx=0,ny=0,nz=0;
  for(let s=0;s<70;s++){
    const b = getBlock(x,y,z);
    if(b!==0 && b!==9) return {x,y,z,nx,ny,nz,b};
    if(tx<ty && tx<tz){ if(tx>5) break; x+=sx; tx+=dx; nx=-sx; ny=0; nz=0; }
    else if(ty<tz){ if(ty>5) break; y+=sy; ty+=dy; ny=-sy; nx=0; nz=0; }
    else { if(tz>5) break; z+=sz; tz+=dz; nz=-sz; nx=0; ny=0; }
  }
  return null;
}
function tickMine(dt){
  const h = playing ? target() : null;
  marker.visible = !!h;
  if(h) marker.position.set(h.x+0.5,h.y+0.5,h.z+0.5);
  if(!mining || !h || BLOCKS[h.b].hard < 0){
    mineProg = 0; mineKey = null; crackMesh.visible = false; return;
  }
  const k = h.x+","+h.y+","+h.z;
  if(k !== mineKey){ mineKey = k; mineProg = 0; }
  const hand = inv[P.slot], it = hand ? ITEMS[hand[0]] : null;
  const power = (it && it.tool && it.tool === BLOCKS[h.b].tool) ? it.power : 1;
  mineProg += dt * power / BLOCKS[h.b].hard;

  crackMesh.visible = true;
  crackMesh.position.set(h.x+0.5,h.y+0.5,h.z+0.5);
  crackMat.map = CRACK[Math.min(9, Math.floor(mineProg*10))];
  crackMat.needsUpdate = true;

  if(mineProg >= 1){
    let drop = BLOCKS[h.b].drop;
    if(h.b === 6){ const r=Math.random(); drop = r<0.06 ? 64 : (r<0.30 ? 65 : (r<0.75 ? 6 : 0)); }
    if(drop) addItem(drop,1);
    burst(h.x,h.y,h.z,h.b);
    setBlock(h.x,h.y,h.z,0);
    floodWater(h.x,h.y,h.z);
    mineProg = 0; mineKey = null;
    drawBars();
  }
}
function use(){
  const aim = target();
  if(aim && BLOCKS[aim.b] && BLOCKS[aim.b].table){ openInv(true); return; }
  const s = inv[P.slot];
  if(!s){ toast("Nothing in hand"); return; }
  const D = def(s[0]);
  if(D.food){
    if(P.food >= 20){ toast("Not hungry"); return; }
    P.food = Math.min(20, P.food + D.food);
    if(--s[1] <= 0) inv[P.slot] = null;
    toast("Ate " + D.name); drawBars(); return;
  }
  if(!isBlock(s[0])){ toast(D.name + " can't be placed"); return; }
  const h = aim; if(!h) return;
  const x=h.x+h.nx, y=h.y+h.ny, z=h.z+h.nz;
  if(solid(getBlock(x,y,z))) return;
  if(x===Math.floor(P.pos.x) && z===Math.floor(P.pos.z) &&
     y>=Math.floor(P.pos.y) && y<=Math.floor(P.pos.y+TALL-0.001)) return;
  setBlock(x,y,z,s[0]);
  swingHand();
  if(--s[1] <= 0) inv[P.slot] = null;
  drawBars();
}

if(TOUCH){
  document.body.classList.add("touch");
  const pad=document.getElementById("pad"), nub=document.getElementById("nub");
  let padId=null, lookId=null, lx=0, ly=0, cx0=0, cy0=0;
  pad.addEventListener("touchstart", e => {
    const t=e.changedTouches[0]; padId=t.identifier;
    const r=pad.getBoundingClientRect(); cx0=r.left+r.width/2; cy0=r.top+r.height/2;
    e.preventDefault();
  }, {passive:false});
  addEventListener("touchstart", e => {
    if(!playing) return;
    for(let i=0;i<e.changedTouches.length;i++){
      const t = e.changedTouches[i];
      if(t.identifier===padId) continue;
      if(t.target.closest && (t.target.closest(".tbtn")||t.target.closest("#hotbar")||t.target.closest("#pad"))) continue;
      if(lookId===null && t.clientX > innerWidth*0.33){ lookId=t.identifier; lx=t.clientX; ly=t.clientY; }
    }
  }, {passive:true});
  addEventListener("touchmove", e => {
    for(let i=0;i<e.changedTouches.length;i++){
      const t = e.changedTouches[i];
      if(t.identifier===padId){
        let dx=t.clientX-cx0, dy=t.clientY-cy0;
        const d=Math.hypot(dx,dy), max=50;
        if(d>max){ dx=dx/d*max; dy=dy/d*max; }
        nub.style.transform="translate("+dx+"px,"+dy+"px)";
        move.x=dx/max; move.z=dy/max;
      } else if(t.identifier===lookId){
        const s = OPT.sens/100*0.005;
        P.yaw -= (t.clientX-lx)*s;
        P.pitch -= (t.clientY-ly)*s*(OPT.invert?-1:1);
        P.pitch = Math.max(-1.55, Math.min(1.55, P.pitch));
        lx=t.clientX; ly=t.clientY;
      }
    }
  }, {passive:true});
  const endT = e => {
    for(let i=0;i<e.changedTouches.length;i++){
      const t = e.changedTouches[i];
      if(t.identifier===padId){ padId=null; move.x=move.z=0; nub.style.transform=""; }
      if(t.identifier===lookId) lookId=null;
    }
  };
  addEventListener("touchend", endT, {passive:true});
  addEventListener("touchcancel", endT, {passive:true});

  const mineB=document.getElementById("bMine");
  mineB.addEventListener("touchstart", e=>{ mining=true; e.preventDefault(); }, {passive:false});
  mineB.addEventListener("touchend", ()=>{ mining=false; }, {passive:true});

  const jumpB=document.getElementById("bJump");
  jumpB.addEventListener("touchstart", e=>{ keys.Space=true; e.preventDefault(); }, {passive:false});
  jumpB.addEventListener("touchend", ()=>{ keys.Space=false; }, {passive:true});
  const runB=document.getElementById("bRun");
  runB.addEventListener("click", ()=>{ runToggle=!runToggle; runB.classList.toggle("on",runToggle); });
  document.getElementById("bBag").addEventListener("click", function(){ openInv(false); });
}

let optReturn = "sTitle";
const OPT_DEFS = [
  {k:"rd",      label:"Render distance", type:"range", min:2, max:8,  step:1, fmt:v=>v+" chunks"},
  {k:"fov",     label:"Field of view",   type:"range", min:60,max:100,step:1, fmt:v=>v+"\u00b0"},
  {k:"sens",    label:"Look sensitivity",type:"range", min:30,max:220,step:5, fmt:v=>v+"%"},
  {k:"invert",  label:"Invert vertical", type:"bool"},
  {k:"smooth",  label:"Smooth lighting", type:"bool"},
  {k:"clouds",  label:"Clouds",          type:"bool"},
  {k:"cycle",   label:"Day and night",   type:"bool"},
  {k:"autosave",label:"Autosave",        type:"bool"}
];
function buildOptions(){
  const list = document.getElementById("optList");

  OPT_DEFS.forEach(o => {
    const row = document.createElement("div"); row.className="opt";
    const b = document.createElement("b"); b.textContent = o.label; row.appendChild(b);

      const val = document.createElement("span"); val.className="val"; val.textContent=o.fmt(OPT[o.k]);
      const inp = document.createElement("input");
      inp.type="range"; inp.min=o.min; inp.max=o.max; inp.step=o.step; inp.value=OPT[o.k];
      inp.addEventListener("input", ()=>{ OPT[o.k]=+inp.value; val.textContent=o.fmt(OPT[o.k]); applyOption(o.k); });
      row.appendChild(inp); row.appendChild(val);
    } else {
      const btn = document.createElement("button");
      btn.className = "toggle" + (OPT[o.k]?" on":"");

function clickSlot(i){
  const s = inv[i];
  if(held){
    if(s && s[0]===held[0] && s[1]<64){
      const n = Math.min(64-s[1], held[1]);
      s[1]+=n; held[1]-=n;
      if(held[1]<=0) held=null;
    } else { inv[i]=held; held=s; }
  } else if(s){ held=s; inv[i]=null; }
  paintInv(); drawBars();
}
function chip(id,n,ok){
  const w=document.createElement("span");
  if(!ok) w.className="miss";
  w.appendChild(icon(id,13));
  w.appendChild(document.createTextNode(n+" "+nameOf(id)));
  return w;
}

  [].forEach.call(bagEl.children, function(el,k){ fillSlot(el, inv[k+9]); });
  [].forEach.call(barEl.children, function(el,k){ fillSlot(el, inv[k]); el.classList.toggle("on", k===P.slot); });

  heldTag.innerHTML = "";
  if(held){
    heldTag.appendChild(icon(held[0],16));
    heldTag.appendChild(document.createTextNode(held[1] + " \u00d7 " + nameOf(held[0]) + " — tap a slot to drop it"));
  } else {
    heldTag.appendChild(document.createTextNode("Tap a stack to pick it up, tap a slot to put it down."));
  }

  craftHint.textContent = nearTable
    ? "You are at a crafting table, so everything is available."
    : "By hand you can only manage the basics. Place a crafting table and use it for the rest.";

  craftEl.innerHTML = "";
  let cat = null;
  RECIPES.forEach(function(rec){
    if(!nearTable && !rec.hand) return;
    if(rec.cat !== cat){
      cat = rec.cat;
      const h=document.createElement("div"); h.className="cat"; h.textContent=cat;
      craftEl.appendChild(h);
    }
    const can = rec.need.every(function(p){ return countOf(p[0]) >= p[1]; });
    const b=document.createElement("button");
    b.className = "recipe" + (can ? "" : " no");
    b.appendChild(icon(rec.out[0],28));
    const r=document.createElement("div"); r.className="r";
    const t=document.createElement("b");
    t.textContent = (rec.out[1]>1 ? rec.out[1]+" \u00d7 " : "") + nameOf(rec.out[0]);
    const ing=document.createElement("div"); ing.className="ing";
    rec.need.forEach(function(p){ ing.appendChild(chip(p[0], p[1], countOf(p[0]) >= p[1])); });
    r.appendChild(t); r.appendChild(ing); b.appendChild(r);
    const pill=document.createElement("em"); pill.className="pill";
    pill.textContent = can ? "Craft" : "Need more";
    b.appendChild(pill);
    b.addEventListener("click", function(){
      if(!rec.need.every(function(p){ return countOf(p[0]) >= p[1]; })) return;
      rec.need.forEach(function(p){ takeItem(p[0], p[1]); });
      addItem(rec.out[0], rec.out[1]);
      toast("Crafted " + nameOf(rec.out[0]));
      paintInv(); drawBars();
    });
    craftEl.appendChild(b);
  });
}

/* ═══════════ storage ═══════════ */
const HAS_STORE = !!(window.storage && window.storage.get);
let LS = null;
if(!HAS_STORE){
  // installed or self-hosted: fall back to the browser's own store
  try{ localStorage.setItem("bc:probe","1"); localStorage.removeItem("bc:probe"); LS = localStorage; }
  catch(e){ LS = null; }
}
document.getElementById("storageNote").textContent = (HAS_STORE || LS)
  ? "Worlds save to this device and come back when you return."
  : "Storage is unavailable here, so worlds last only for this session.";
if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function(){});
const memStore = {};
async function put(k,v){
  if(HAS_STORE){ try{ await window.storage.set(k,v); return; }catch(e){} }
  if(LS){ try{ LS.setItem(k,v); return; }catch(e){} }
  memStore[k] = v;
}
async function got(k){
  if(HAS_STORE){ try{ const r = await window.storage.get(k); return r ? r.value : null; }catch(e){} }
  if(LS){ try{ const v = LS.getItem(k); if(v !== null) return v; }catch(e){} }
  return memStore[k] || null;
}
async function del(k){
  if(HAS_STORE){ try{ await window.storage.delete(k); return; }catch(e){} }
  if(LS){ try{ LS.removeItem(k); }catch(e){} }
  delete memStore[k];
}
const saveOptions = () => put("bc:opts", JSON.stringify(OPT));

async function saveWorld(){
  if(!world) return;
  const packed = [];
  edits.forEach((m,k) => packed.push([k, Array.from(m)]));
  await put("bc:w:"+world.id, JSON.stringify({
    v:3, seed:world.seed, spawn:world.spawn, time:world.time, edits:packed,
    player:{p:[P.pos.x,P.pos.y,P.pos.z], r:[P.yaw,P.pitch], hp:P.hp, food:P.food, air:P.air, slot:P.slot},
    inv:inv
  }));
  const e = index.filter(w => w.id === world.id)[0];
  if(e){ e.played = Date.now(); await saveIndex(); }
}

function fmtAgo(ts){
  const s = (Date.now()-ts)/1000;
  if(s < 90) return "just now";
  if(s < 5400) return Math.round(s/60)+" min ago";
  if(s < 172800) return Math.round(s/3600)+" hr ago";
  return Math.round(s/86400)+" days ago";
}
let selWorld = null;
const sorted = () => index.slice().sort((a,b)=>b.played-a.played);

  const list = document.getElementById("worldList");

  if(!ws.length){
    selWorld = null;

      m.appendChild(nm); m.appendChild(sb); b.appendChild(m);
      b.addEventListener("click", ()=>{ selWorld = w.id; renderWorlds(); });

document.getElementById("wDelete").addEventListener("click", async ()=>{

document.getElementById("nCreate").addEventListener("click", async ()=>{
  const name = (document.getElementById("nName").value || "New World").trim().slice(0,24) || "New World";
  const raw = document.getElementById("nSeed").value.trim();

  if(raw === "") seed = (Math.random()*1e9)|0;
  else if(/^-?\d+$/.test(raw)) seed = Math.abs(parseInt(raw,10)) % 1e9;

  index.push({id, name, seed, played:Date.now()});

/* ═══════════ enter a world ═══════════ */
const TIPS = ["Trees give logs. Logs give planks. Planks give a table.",
  "Aim at a placed crafting table and use it to open every recipe.",
  "A stone pickaxe cuts rock four times faster than your hands.",
  "Standing still costs less food than sprinting.","A fall over three blocks will hurt.",
  "Leaves drop apples, sticks and leaves.","Cobble compresses into stone, then bricks."];
async function openWorld(id, fresh){
  const entry = index.filter(w=>w.id===id)[0];
  if(!entry) return;
  const raw = fresh ? null : await got("bc:w:"+id);
  let data = null;
  if(raw){ try{ data = JSON.parse(raw); }catch(e){} }

  show("sLoad");
  document.getElementById("loadTitle").textContent = (data ? "Loading " : "Building ") + entry.name;
  document.getElementById("loadTip").textContent = TIPS[(Math.random()*TIPS.length)|0];
  await new Promise(r => setTimeout(r, 30));

  stopPanorama();
  wipeWorld();
  initNoise(entry.seed);
  world = {id:id, name:entry.name, seed:entry.seed, time:data ? data.time : DAY*0.12, spawn:null};

  if(data){
    (data.edits||[]).forEach(pair => edits.set(pair[0], new Map(pair[1])));
    world.spawn = data.spawn || findSpawn();
    P.pos.set(data.player.p[0], data.player.p[1], data.player.p[2]);
    P.yaw = data.player.r[0]; P.pitch = data.player.r[1];
    P.hp = data.player.hp; P.food = data.player.food; P.air = data.player.air;
    P.slot = data.player.slot || 0;
    inv = (data.inv || []).slice(0,27);
    while(inv.length < 27) inv.push(null);
  } else {
    world.spawn = findSpawn();
    P.pos.set(world.spawn.x, world.spawn.y, world.spawn.z);
    P.yaw = 0.6; P.pitch = -0.1;
    P.hp = 20; P.food = 20; P.air = 300; P.slot = 0;
    inv = new Array(27).fill(null);
  }
  P.vel.set(0,0,0); P.fallFrom = null; P.hurtCool = 0; P.regen = 0; P.starve = 0; P.drown = 0;
  drawBars();

  await new Promise(res => {
    const warm = setInterval(()=>{
      stream(P.pos.x, P.pos.z);
      if(areaReady(P.pos.x, P.pos.z)){ clearInterval(warm); res(); }
    }, 16);
  });

  let guard = 0;
  while(hits(P.pos) && guard++ < 90) P.pos.y += 1;
  settle();

  entry.played = Date.now(); saveIndex();
  resume();
}

/* ═══════════ tick ═══════════ */
function tick(dt){
  let fx = move.z ? -move.z : 0, sx = move.x || 0;
  if(keys.KeyW||keys.ArrowUp)    fx += 1;
  if(keys.KeyS||keys.ArrowDown)  fx -= 1;
  if(keys.KeyD||keys.ArrowRight) sx += 1;
  if(keys.KeyA||keys.ArrowLeft)  sx -= 1;
  const len = Math.hypot(fx,sx);
  if(len > 1){ fx/=len; sx/=len; }

  const sin=Math.sin(P.yaw), cos=Math.cos(P.yaw);
  const wx = -sin*fx + cos*sx, wz = -cos*fx - sin*sx;

  const bx = Math.floor(P.pos.x), bz = Math.floor(P.pos.z);
  const feetWet = isWater(getBlock(bx, Math.floor(P.pos.y+0.1), bz));
  const bodyWet = isWater(getBlock(bx, Math.floor(P.pos.y+1.3), bz));
  const wet = feetWet || bodyWet;
  const atSurface = feetWet && !bodyWet;   // chest clear of the water, feet still under
  const jumpNow = !!keys.Space, jumpTap = jumpNow && !P.jumpPrev;
  P.jumpPrev = jumpNow;
  const sprinting = (keys.ShiftLeft||keys.ShiftRight||runToggle) && len > 0.4 && P.food > 3;
  let speed = sprinting ? RUN : WALK;
  if(P.food <= 0) speed *= 0.7;
  if(wet) speed *= 0.62;

  const grip = P.ground ? 14 : 5;
  P.vel.x += (wx*speed - P.vel.x) * Math.min(1, grip*dt);
  P.vel.z += (wz*speed - P.vel.z) * Math.min(1, grip*dt);
  if(Math.abs(P.vel.x) < 0.003) P.vel.x = 0;
  if(Math.abs(P.vel.z) < 0.003) P.vel.z = 0;

  if(wet){
    P.vel.y -= G*0.22*dt;
    if(P.vel.y < -3.0) P.vel.y = -3.0;
    if(atSurface && jumpTap){
      P.vel.y = JUMP;                 // tap at the surface to leap onto the bank
      P.food = Math.max(0, P.food-0.05);
    } else if(jumpNow && bodyWet){
      P.vel.y = 2.0;                  // hold to swim up; you settle chest-deep at the top
    }
    P.fallFrom = null;
  } else {
    P.vel.y -= G*dt;
    if(P.vel.y < -54) P.vel.y = -54;
    if(jumpNow && P.ground){ P.vel.y = JUMP; P.ground = false; P.food = Math.max(0, P.food-0.05); }
  }

  P.wetFor = wet ? 0.8 : Math.max(0, P.wetFor - dt);
  P.ground = false;
  P.stepped = false;
  P.canStep = wet || P.wetFor > 0;   // the climb may finish just after you leave the water
  axisMove("x", P.vel.x*dt);
  axisMove("z", P.vel.z*dt);
  axisMove("y", P.vel.y*dt);

  if(!wet){
    if(!P.ground && P.vel.y < 0 && P.fallFrom === null) P.fallFrom = P.pos.y;
    if(P.fallFrom !== null && P.vel.y > 0) P.fallFrom = null;
    if(P.ground && P.fallFrom !== null){
      const drop = P.fallFrom - P.pos.y;
      if(drop > 3.4) hurt(Math.floor(drop - 3), "a long fall");
      P.fallFrom = null;
    }
  }

  P.food = Math.max(0, P.food - (len > 0.15 ? (sprinting ? 0.055 : 0.018) : 0.004) * dt);

  P.hurtCool = Math.max(0, P.hurtCool - dt);
  if(P.food >= 16 && P.hp < 20 && P.hurtCool <= 0){
    P.regen += dt;
    if(P.regen >= 3.2){ P.regen = 0; P.hp = Math.min(20, P.hp+1); P.food = Math.max(0,P.food-0.6); drawBars(); }
  } else P.regen = 0;

  if(P.food <= 0){
    P.starve += dt;
    if(P.starve >= 4){ P.starve = 0; hurt(1, "starvation"); }
  } else P.starve = 0;

  if(eyeInWater()){
    P.air -= dt*30;
    if(P.air <= 0){
      P.air = 0; P.drown += dt;
      if(P.drown >= 1){ P.drown = 0; hurt(2, "drowning"); }
    }
    drawBars();
  } else if(P.air < 300){
    P.air = Math.min(300, P.air + dt*120); P.drown = 0; drawBars();
  }

  if(P.pos.y < -18) hurt(20, "the void");
  world.time += dt;
}

/* ═══════════ loop ═══════════ */
let prev = performance.now(), acc = 0, frames = 0, fps = 0, hudAcc = 0, autoAcc = 0;
let waterPhase = 0, waterAt = 0;
function loop(){
  requestAnimationFrame(loop);
  const now = performance.now();
  let dt = (now - prev)/1000; prev = now;
  if(dt > 0.1) dt = 0.1;
  frames++; acc += dt;
  if(acc >= 0.5){ fps = Math.round(frames/acc); frames = 0; acc = 0; }

  if(!world && panorama){
    panorama.yaw += dt * 0.05;
    stream(panorama.x, panorama.z);
  }
  if(world){
    if(playing){
      physAcc += dt;
      if(physAcc > 0.2) physAcc = 0.2;          // a long stall must not fast-forward the world
      let steps = 0;
      while(physAcc >= STEP && steps < 24){
        prevPos.copy(P.pos);
        tick(STEP);
        physAcc -= STEP;
        steps++;
        if(!playing) break;                      // died mid-step
      }
    } else physAcc = 0;
    stream(P.pos.x, P.pos.z);
    tickMine(playing ? dt : 0);
  }

  if(!world && panorama){
    camera.position.set(panorama.x, panorama.y, panorama.z);
    camera.rotation.set(-0.13, panorama.yaw, 0);
  } else {
    if(playing){
      viewPos.copy(prevPos).lerp(P.pos, Math.min(1, physAcc/STEP));
      if(viewPos.distanceToSquared(P.pos) > 0.25) viewPos.copy(P.pos);   // teleport, don't smear
    } else viewPos.copy(P.pos);
    camera.position.set(viewPos.x, viewPos.y+EYE, viewPos.z);
    camera.rotation.set(P.pitch, P.yaw, 0);
  }

  let phase = 0.22;
  if(world && OPT.cycle) phase = (world.time % DAY)/DAY;
  const elev = Math.sin(phase*Math.PI*2);
  let light = 1;
  if(world && OPT.cycle) light = Math.max(0, Math.min(1, (elev+0.28)/0.55));
  const bright = 0.24 + 0.76*light;
  const under = !!world && eyeInWater();
  if(under){
    // everything you see through water takes the water's colour
    matOpaque.color.setRGB(bright*0.44, bright*0.71, bright*0.97);
    matCut.color.setRGB(bright*0.44, bright*0.71, bright*0.97);
    matClear.color.setRGB(bright*0.64, bright*0.85, bright*1.00);
  } else {
    matOpaque.color.setScalar(bright);
    matCut.color.setScalar(bright);
    matClear.color.setScalar(bright);
  }
  const sky = NIGHT_SKY.clone().lerp(DAY_SKY, light);
  if(world && OPT.cycle){
    // the sky warms as the sun grazes the horizon
    const dusk = Math.max(0, 1 - Math.abs(elev)*3.2);
    if(dusk > 0) sky.lerp(DUSK, dusk*0.5);
  }
  if(under) sky.setHex(0x1d5f96).multiplyScalar(0.30 + 0.70*light);
  scene.background.copy(sky);
  scene.fog.color.copy(sky);
  scene.fog.near = under ? 0.5 : RD*CS*0.55;
  scene.fog.far  = under ? 26  : RD*CS*0.98;

  cloudMesh.visible = OPT.clouds && !under && (!!world || !!panorama);
  if(cloudMesh.visible){
    if(panorama && !world) cloudMesh.position.set(panorama.x, 104, panorama.z);
    else cloudMesh.position.set(P.pos.x, 104, P.pos.z);
    cloudMesh.material.map.offset.set(P.pos.x/50 + now*0.000004, -P.pos.z/50);
    cloudMesh.material.color.setScalar(0.35 + 0.65*light);
  }
  skyGroup.visible = !under && (!!world || !!panorama);
  if(skyGroup.visible){
    skyGroup.position.copy(camera.position);
    skyGroup.rotation.z = phase*Math.PI*2;
    starMat.opacity = Math.max(0, 1 - light*1.7);
    starMesh.visible = starMat.opacity > 0.02;
    sunMesh.material.opacity = 0.35 + 0.65*light;
    moonMesh.material.opacity = 1 - light*0.75;
  }
  if(world) tickParts(dt);
  waterEl.style.opacity = under ? 1 : 0;

  hudAcc += dt;
  if(hudAcc > 0.25 && world){
    hudAcc = 0;
    const hh = Math.floor((((world.time % DAY)/DAY)*24 + 6) % 24);
    coordsEl.textContent =
      "x " + P.pos.x.toFixed(1) + "  y " + P.pos.y.toFixed(1) + "  z " + P.pos.z.toFixed(1) +
      "\n" + fps + " fps \u00b7 " + (hh<10?"0":"") + hh + ":00" +
      (inv[P.slot] ? "\n" + nameOf(inv[P.slot][0]) : "");
  }

  if(playing && OPT.autosave){
    autoAcc += dt;
    if(autoAcc > 60){ autoAcc = 0; saveWorld(); }
  }

  waterPhase += dt;
  if(now - waterAt > 110){ waterAt = now; drawWater(waterPhase*1.6); tex.needsUpdate = true; }

  renderer.render(scene, camera);

  // the held item lives in its own pass so it can never clip into a wall
  if(world && playing && !invOpen){
    tickHand(dt);
    handCam.aspect = camera.aspect;
    handCam.updateProjectionMatrix();
    renderer.autoClear = false;
    renderer.clearDepth();
    renderer.render(handScene, handCam);
    renderer.autoClear = true;
  }
}

let installPrompt = null;
const installBtn = document.getElementById("mInstall");
addEventListener("beforeinstallprompt", function(e){
  e.preventDefault();
  installPrompt = e;
  installBtn.classList.remove("hide");
});
installBtn.addEventListener("click", async function(){
  if(!installPrompt) return;
  installBtn.classList.add("hide");
  installPrompt.prompt();
  try{ await installPrompt.userChoice; }catch(e){}
  installPrompt = null;
});
addEventListener("appinstalled", function(){
  installPrompt = null;
  installBtn.classList.add("hide");
});
// iOS has no install prompt, so point at the share sheet instead
(function(){
  const ios = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
              (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  if(ios && !standalone && location.protocol.indexOf("http") === 0)
    document.getElementById("iosHint").classList.remove("hide");
})();

/* keep the screen alive while you are actually playing */
let wakeLock = null;
async function keepAwake(on){
  try{
    if(on && !wakeLock && navigator.wakeLock){
      wakeLock = await navigator.wakeLock.request("screen");
      wakeLock.addEventListener("release", function(){ wakeLock = null; });
    } else if(!on && wakeLock){
      const w = wakeLock; wakeLock = null; await w.release();
    }
  }catch(e){ wakeLock = null; }
}

/* switching away from the app saves and pauses rather than running blind */
document.addEventListener("visibilitychange", function(){
  if(document.hidden){
    keepAwake(false);
    if(world && playing){ saveWorld(); pause(); }
  } else if(playing) keepAwake(true);
});

/* ═══════════ boot ═══════════ */
function resize(){
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
}
addEventListener("resize", resize);
resize();

(async function boot(){
  await loadOptions();
  await loadIndex();
  buildOptions();
  drawBars();
  buildLogo("BLOCKCRAFT");
  startPanorama();
  show("sTitle");
  loop();
})();

addEventListener("beforeunload", ()=>{ if(world && OPT.autosave) saveWorld(); });

})();
</script>
